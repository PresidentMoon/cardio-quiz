<style>
:root{
  --chrome:#EEF1F5; --bar:#FFFFFF; --ink:#1D2856; --soft:#5B6690; --muted:#8892A6; --line:#DDE3EA; --accent:#D4483C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --chrome:#12151C; --bar:#1A1F29; --ink:#E4E9F5; --soft:#A3AECA; --muted:#6F7A90; --line:#2A3140; --accent:#E2665A;
}}
:root[data-theme="dark"]{ --chrome:#12151C; --bar:#1A1F29; --ink:#E4E9F5; --soft:#A3AECA; --muted:#6F7A90; --line:#2A3140; --accent:#E2665A; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--soft);outline-offset:2px}

.toolbar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
.brand{font-weight:600;margin-right:8px}
.grp{display:flex;align-items:center;gap:4px;padding:0 6px;border-right:1px solid var(--line)}
.grp:last-of-type{border-right:none}
.tb{border:1px solid transparent;background:none;border-radius:8px;min-width:40px;height:40px;padding:0 10px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb[aria-pressed="true"]{background:var(--chrome);border-color:var(--line);font-weight:600}
.tb:disabled{opacity:.35;cursor:default}
.tb.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;min-width:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.wd{min-width:34px}
.wd i{display:block;border-radius:4px;background:var(--ink);width:18px}
.sp{flex:1}
#saveState{font-size:12px;color:var(--muted);margin-right:6px}
.dev-galaxy .tb{height:46px;min-width:46px}
.dev-galaxy .tb.sw{width:26px;height:26px;min-width:0}
#penHint{font-size:12px;color:var(--muted)}
.dev-ipad #penHint{display:none}

#scroller{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:none}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:22px 16px 120px;min-width:100%;width:max-content;box-sizing:border-box;transform-origin:0 0}
#zoomVal{min-width:52px;font-variant-numeric:tabular-nums}
.page{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);touch-action:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pagebar{position:absolute;left:0;right:0;top:-20px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pagebar button,.pagebar select{background:none;border:none;font-size:12px;color:var(--muted);padding:0 4px}

#quick{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:6px;z-index:6}
.dev-ipad #quick{display:flex}
#quick button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--bar);font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#quick button[aria-pressed="true"]{background:var(--ink);color:var(--bar);border-color:var(--ink)}

#status{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bar);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
#status.show{opacity:1;pointer-events:auto}
#status button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px;margin-left:8px;font-size:13px}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--bar);color:var(--ink);padding:22px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(10,15,30,.4)}
dialog h3{margin:0 0 14px;font-size:17px}
dialog p{margin:0 0 12px;color:var(--soft);line-height:1.55}
.field{margin:0 0 16px}
.field>span{display:block;font-size:13px;color:var(--soft);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--chrome);border-radius:8px;padding:9px 14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bar);border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chrome);border-radius:8px;padding:9px 14px}
.primary{background:var(--ink);color:var(--bar);border-color:var(--ink);font-weight:600}
.danger{border-color:var(--accent);color:var(--accent);background:none}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#exportBox{display:none;width:100%;height:100px;margin-top:10px;font-family:ui-monospace,monospace;font-size:11px}
.papers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#selBar[hidden],#selHint[hidden]{display:none!important}
@media (max-width:560px){.papers{grid-template-columns:repeat(2,1fr)}}
#dlgPaper{width:min(620px,94vw)}
.papers button{border:1px solid var(--line);background:var(--chrome);border-radius:10px;padding:12px;text-align:left}
.papers small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
</style>
</head>
<body class="dev-galaxy">
<div class="toolbar" role="toolbar" aria-label="필기 도구">
  <span class="brand">필체 노트</span>
  <button class="tb" id="tBooks" style="font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📒 내 노트</button>
  <div class="grp">
    <button class="tb" id="tPen" aria-pressed="true">펜</button>
    <button class="tb" id="tEraser" aria-pressed="false">지우개</button>
    <button class="tb" id="tEraseMode" hidden>획 단위</button>
    <button class="tb" id="tEraseSize" hidden>작게</button>
    <button class="tb" id="tHl" aria-pressed="false">형광펜</button>
    <button class="tb" id="tLasso" aria-pressed="false">올가미</button>
    <button class="tb" id="tGhost" aria-pressed="false" style="font-weight:600">대필</button>
  </div>
  <div class="grp" id="colors"></div>
  <div class="grp" id="widths"></div>
  <div class="grp">
    <button class="tb" id="tUndo" aria-label="실행취소" disabled>↶</button>
    <button class="tb" id="tRedo" aria-label="다시실행" disabled>↷</button>
  </div>
  <div class="grp"><button class="tb" id="tZoomOut" aria-label="축소">−</button><button class="tb" id="zoomVal" aria-label="화면 폭에 맞추기">100%</button><button class="tb" id="tZoomIn" aria-label="확대">+</button></div>
  <div class="grp"><button class="tb" id="tAddPage">+ 페이지</button><button class="tb" id="tForm" style="font-weight:600">PDF 불러오기</button></div>
  <span id="penHint">S펜 버튼 = 지우개</span>
  <span class="sp"></span>
  <span id="saveState"></span>
  <button class="tb" id="tDevice"></button>
  <button class="tb" id="tExport" style="font-weight:600">저장</button>
  <button class="tb" id="tMore">설정</button>
</div>

<div id="scroller"><div id="pages"></div></div>

<div id="quick" aria-label="빠른 전환">
  <button id="qPen" aria-pressed="true">펜</button>
  <button id="qEraser" aria-pressed="false">지우개</button>
</div>
<div id="status" role="status"></div>
<div id="selBar" hidden style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:6px;background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 2px 10px rgba(0,0,0,.15)">
  <button class="tb" id="sDel">삭제</button><button class="tb" id="sCopy">복사</button><button class="tb" id="sPaste">붙여넣기</button><button class="tb" id="sDup">복제</button><button class="tb" id="sThin">얇게</button><button class="tb" id="sThick">굵게</button><button class="tb" id="sNone">선택 해제</button>
</div>
<p id="selHint" hidden style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:15;margin:0;font-size:12px;color:var(--muted);background:var(--bar);padding:3px 8px;border-radius:6px">안쪽을 끌면 이동 · 파란 모서리를 끌면 크기 조절 · 색을 누르면 색 바꾸기</p>

<dialog id="dlgPaper">
  <h3 id="paperTitle">새 페이지</h3>
  <div class="papers">
    <button data-paper="ruled">줄<small>줄 간격 8.4mm</small></button>
    <button data-paper="wide">넓은 줄<small>줄 간격 11mm</small></button>
    <button data-paper="blank">무지<small>줄 없음</small></button>
    <button data-paper="grid">모눈<small>8.4mm 칸</small></button>
    <button data-paper="narrow">좁은 줄<small>줄 간격 6.7mm</small></button>
    <button data-paper="dot">점 모눈<small>8.4mm 점</small></button>
    <button data-paper="cornell">코넬 노트<small>제목·단서·필기·요약</small></button>
    <button data-paper="todo">할 일 목록<small>체크 칸 + 줄</small></button>
    <button data-paper="wrong">오답 노트<small>문제 / 풀이 나눔</small></button>
    <button data-paper="manuscript">원고지<small>20칸</small></button>
    <button data-paper="music">오선지<small>악보</small></button>
    <button data-paper="weekly">주간 계획<small>월~일</small></button>
    <button id="btnImportForm" style="grid-column:1/-1">PDF·사진 양식 불러오기<small>학교 서류 같은 양식을 배경으로 깔고 그 위에 써요. PDF는 쪽마다 페이지가 생겨요</small></button>
  </div>
  <input type="file" id="fileForm" accept="application/pdf,image/*" hidden>
  <p id="formStatus" style="font-size:13px;margin:10px 0 0"></p>
  <div class="actions"><button class="btn" data-close>취소</button></div>
</dialog>

<dialog id="dlgSettings">
  <h3>설정</h3>
  <div class="field"><span>기기</span>
    <div class="seg" id="devSeg"><button data-dev="galaxy">갤럭시 탭 (S펜)</button><button data-dev="ipad">아이패드 (애플 펜슬)</button></div>
  </div>
  <div class="field"><span>필압 반응 <b id="gammaVal"></b></span>
    <input type="range" id="gamma" min="0.5" max="1.6" step="0.05" style="width:100%">
    <p style="font-size:12px;margin:4px 0 0">왼쪽일수록 살짝 눌러도 굵어져요. 저장되는 필압 원본 값은 바뀌지 않아요.</p>
  </div>
  <div class="field"><label class="check"><input type="checkbox" id="allowTouch"><span>손가락·마우스로도 쓰기<br><small style="color:var(--muted)">테스트용. 끄면 펜으로만 쓰고 손가락은 스크롤해요.</small></span></label></div>
  <div class="field"><span>노트 데이터</span>
    <div class="row" style="margin-bottom:6px"><button class="btn primary" id="btnHandData">필체 데이터 다운로드 (전체 노트의 손글씨)</button></div>
    <p style="font-size:12px;margin:0 0 12px" id="handInfo"></p>
    <p style="font-size:12px;margin:-6px 0 12px"><a href="label.html" target="_blank" rel="noopener">라벨링 도구 열기</a> (GitHub 사이트에 같이 올렸을 때)</p>
    <div class="row" style="margin-bottom:8px"><button class="btn" id="btnPack">필체 팩 불러오기</button><input type="file" id="filePack" accept=".json,application/json" hidden></div>
    <p style="font-size:12px;margin:0 0 10px" id="packInfo"></p>
    <div class="row" style="margin-bottom:10px"><input id="packUrl" placeholder="비워 두면 기본 주소(GitHub hw_note) 사용" style="flex:1;min-width:220px;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--chrome);color:var(--ink);-webkit-user-select:text;user-select:text"><button class="btn" id="packCheck">새 팩 확인</button></div>
    <div class="row"><button class="btn" id="btnExport">하나씩 골라 저장</button><button class="btn" id="btnImport">가져오기 (PDF·사진·노트 JSON)</button><input type="file" id="fileImport" accept=".json,application/json,application/pdf,.pdf,image/*" hidden></div>
    <p style="font-size:12px;margin:6px 0 0" id="lastExport"></p>
  </div>
  <div class="actions"><button class="btn danger" id="btnWipe">모든 페이지 삭제</button><button class="btn primary" data-close>닫기</button></div>
</dialog>

<dialog id="dlgBooks">
  <h3>노트북</h3>
  <div id="bookList" style="display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto"></div>
  <div class="row" style="margin-top:14px"><input id="newBookName" placeholder="새 노트북 이름" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--chrome);color:var(--ink);-webkit-user-select:text;user-select:text"><button class="btn primary" id="newBookGo">만들기</button></div>
  <div class="actions"><button class="btn" data-close>닫기</button></div>
</dialog>

<dialog id="dlgGhost" style="width:min(660px,95vw)">
  <h3>대필</h3>
  <p id="ghostInfo" style="font-size:13px"></p>
  <div class="row" style="margin-bottom:6px"><button class="btn" id="ghostImport">PDF·사진에서 글 가져오기</button><input type="file" id="fileSrc" accept="application/pdf,.pdf,image/*" hidden><small id="srcStatus" style="color:var(--muted)"></small></div>
  <textarea id="ghostText" rows="4" style="width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--chrome);color:var(--ink);-webkit-user-select:text;user-select:text" placeholder="이 칸에 쓸 내용 (줄바꿈 = 다음 줄)"></textarea>
  <div class="field" style="margin-top:12px"><span>글씨 크기 <b id="ghostSizeVal">100%</b></span><input type="range" id="ghostSize" min="50" max="180" value="100" style="width:100%"></div>
  <div class="field"><span>글씨 굵기 <b id="ghostWVal">100%</b></span><input type="range" id="ghostW" min="40" max="250" value="100" style="width:100%"></div>
  <div style="border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:42vh;background:#fff"><canvas id="ghostPrev" style="display:block"></canvas></div>
  <p id="ghostWarn" style="font-size:13px;color:var(--accent);min-height:18px;margin:6px 0 0"></p>
  <div class="actions"><button class="btn" id="ghostShuffle">다른 모양으로</button><span style="flex:1"></span><button class="btn" data-close>취소</button><button class="btn primary" id="ghostGo">이대로 쓰기</button></div>
</dialog>

<dialog id="dlgSrc" style="width:min(700px,95vw)">
  <h3>가져온 글</h3>
  <p style="font-size:13px">옮겨 쓸 부분을 드래그로 선택하고 <b>선택한 부분 넣기</b>, 또는 <b>전체 넣기</b>. 여기서 바로 고쳐도 돼요.</p>
  <textarea id="srcText" style="width:100%;height:42vh;font-size:15px;line-height:1.6;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--chrome);color:var(--ink);-webkit-user-select:text;user-select:text"></textarea>
  <div class="actions"><button class="btn" data-close>닫기</button><button class="btn" id="srcAll">전체 넣기</button><button class="btn primary" id="srcSel">선택한 부분 넣기</button></div>
</dialog>

<dialog id="dlgConfirm">
  <h3 id="cfTitle"></h3><p id="cfText"></p>
  <div class="actions"><button class="btn" data-close>취소</button><button class="btn danger" id="cfOk"></button></div>

const eraseR=()=>(eraseMode==="stroke"?8:11)*(set.eraserBig?2.5:1);

// ---------- 지우개 ----------
function bbox(st){ if (!st._bb){ let a=1e9,b=1e9,c=-1e9,d=-1e9; for (const q of st.pts){ a=Math.min(a,q[0]); b=Math.min(b,q[1]); c=Math.max(c,q[0]); d=Math.max(d,q[1]); } st._bb=[a,b,c,d]; } return st._bb; }
function distSeg(px,py,a,b){ const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy; let t=L?((px-a[0])*dx+(py-a[1])*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(a[0]+t*dx), py-(a[1]+t*dy)); }
function hits(st, x, y, r){ const [a,b,c,d]=bbox(st), m=r+st.w; if (x<a-m||x>c+m||y<b-m||y>d+m) return false;
  const P=st.pts; if (P.length===1) return Math.hypot(x-P[0][0], y-P[0][1])<=m; for (let i=1;i<P.length;i++) if (distSeg(x,y,P[i-1],P[i])<=r+st.w/2) return true; return false; }
function densify(P, step){ const out=[P[0]];
  for (let i=1;i<P.length;i++){ const a=P[i-1], b=P[i], n=Math.floor(Math.hypot(b[0]-a[0],b[1]-a[1])/step);
    for (let k=1;k<=n;k++){ const t=k/(n+1); out.push(a.map((v,j)=>j<4? Math.round((v+(b[j]-v)*t)*(j<2?10:j===3?1000:1))/(j<2?10:j===3?1000:1) : b[j])); }
    out.push(b); } return out; }
function forget(gest, st){ if (gest.added.has(st.id)) gest.added.delete(st.id); else gest.removed.set(st.id, st); }
function eraseAt(p, [x,y], gest){
  const r=eraseR(); const out=[];
  for (const st of p.strokes){
    if (!hits(st,x,y,r)){ out.push(st); continue; }
    forget(gest, st);
    if (eraseMode==="partial"){
      let run=[]; const pieces=[];
      for (const q of densify(st.pts, 2)){ if (Math.hypot(q[0]-x,q[1]-y) <= r+st.w/2){ if (run.length) pieces.push(run); run=[]; } else run.push(q); }
      if (run.length) pieces.push(run);
      for (const pc of pieces){ if (pc.length<2) continue; const ns={...st, id:uid(), pts:pc}; delete ns._bb; out.push(ns); gest.added.add(ns.id); }
    }
  }
  p.strokes=out;
}


// ---------- 확대·축소 ----------
const ZMIN=0.6, ZMAX=3;
function setZoom(z, cx, cy){
  const sc=$("scroller"); z=Math.max(ZMIN, Math.min(ZMAX, z)); const old=set.zoom||1; if (Math.abs(z-old)<0.001) return;
  const r=sc.getBoundingClientRect(); const mx=(cx??(r.left+r.width/2))-r.left, my=(cy??(r.top+r.height/2))-r.top;
  const ax=sc.scrollLeft+mx, ay=sc.scrollTop+my, k=z/old;
  set.zoom=z; layout(); sc.scrollLeft=ax*k-mx; sc.scrollTop=ay*k-my; markDirty(null);
}
$("tZoomIn").onclick=()=>setZoom((set.zoom||1)*1.25);
$("tZoomOut").onclick=()=>setZoom((set.zoom||1)/1.25);
$("zoomVal").onclick=()=>setZoom(1);
(()=>{
  const sc=$("scroller"), box=$("pages");
  const mid=()=>{ const v=[...touches.values()]; return {x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2, d:Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y)}; };
  sc.addEventListener("pointerdown", e=>{
    if (e.pointerType!=="touch") return;
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (touches.size===2){ cancelers.forEach(f=>f()); panning=null; const m=mid(); pinch={d0:m.d, x0:m.x, y0:m.y, z0:set.zoom||1, r:1}; }
    else if (touches.size===1 && !set.allowTouch){ panning={x:e.clientX, y:e.clientY, l:sc.scrollLeft, t:sc.scrollTop}; }
  }, true);
  sc.addEventListener("pointermove", e=>{
    if (e.pointerType!=="touch" || !touches.has(e.pointerId)) return;
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (pinch && touches.size>=2){
      const m=mid(); const z=Math.max(ZMIN, Math.min(ZMAX, pinch.z0*m.d/pinch.d0)); pinch.r=z/pinch.z0; pinch.x=m.x; pinch.y=m.y;
      const r=sc.getBoundingClientRect(); const ox=sc.scrollLeft+pinch.x0-r.left, oy=sc.scrollTop+pinch.y0-r.top;
      box.style.transformOrigin=`${ox}px ${oy}px`; box.style.transform=`translate(${m.x-pinch.x0}px, ${m.y-pinch.y0}px) scale(${pinch.r})`;
    } else if (panning){ sc.scrollLeft=panning.l-(e.clientX-panning.x); sc.scrollTop=panning.t-(e.clientY-panning.y); }
  }, true);
  const up=e=>{
    if (e.pointerType!=="touch") return; touches.delete(e.pointerId);
    if (pinch && touches.size<2){
      const pz=pinch; pinch=null; box.style.transform=""; box.style.transformOrigin="0 0";
      if (Math.abs(pz.r-1)>0.01) setZoom(pz.z0*pz.r, pz.x0, pz.y0);
      if (pz.x!=null){ sc.scrollLeft-=pz.x-pz.x0; sc.scrollTop-=pz.y-pz.y0; }
    }
    if (!touches.size) panning=null;
  };
  sc.addEventListener("pointerup", up, true); sc.addEventListener("pointercancel", up, true);
  sc.addEventListener("wheel", e=>{ if (e.ctrlKey){ e.preventDefault(); setZoom((set.zoom||1)*Math.exp(-e.deltaY*0.01), e.clientX, e.clientY); } }, {passive:false});
})();

// ---------- 실행취소 ----------
function pushUndo(op){ undoStack.push(op); if (undoStack.length>100) undoStack.shift(); redoStack.length=0; syncUndo(); }
function apply(op, reverse){
  const p=pages.find(x=>x.id===op.pid); if (!p) return;
  const rm = reverse? op.added : op.removed, add = reverse? op.removed : op.added;
  const ids=new Set(rm.map(s=>s.id)); p.strokes=p.strokes.filter(s=>!ids.has(s.id)).concat(add);
  drawInk(p); markDirty(p);
  if (sel && sel.p===p){ const ids=new Set([...sel.ids].filter(id=>p.strokes.some(s=>s.id===id))); setSel(ids.size?p:null, ids); }
}
function undo(){ const op=undoStack.pop(); if (!op) return; apply(op,true); redoStack.push(op); syncUndo(); }
function redo(){ const op=redoStack.pop(); if (!op) return; apply(op,false); undoStack.push(op); syncUndo(); }
function syncUndo(){ $("tUndo").disabled=!undoStack.length; $("tRedo").disabled=!redoStack.length; }
$("tUndo").onclick=undo; $("tRedo").onclick=redo;
document.addEventListener("keydown", e=>{ if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); } });

// ---------- 올가미 (선택·이동·크기·삭제·복사) ----------
let sel=null, lassoPath=null, selDrag=null, CLIP=null, rafPending=false;
const cloneStroke=s=>{ const {_bb,...r}=s; return {...r, pts:s.pts.map(q=>q.slice())}; };
const strokesOf=(p,ids)=>p.strokes.filter(s=>ids.has(s.id));
function selBBox(p){ let a=1e9,b=1e9,c=-1e9,d=-1e9; for (const s of strokesOf(p,sel.ids)){ delete s._bb; const q=bbox(s), m=(s.w||2)/2; a=Math.min(a,q[0]-m); b=Math.min(b,q[1]-m); c=Math.max(c,q[2]+m); d=Math.max(d,q[3]+m); } return [a-6,b-6,c+6,d+6]; }
function drawSel(p){ const c=p.el.live.getContext("2d"); clearLive(p); if (!sel||sel.p!==p) return; const [a,b,cc,d]=sel.bb;
  c.save(); c.setLineDash([5,4]); c.strokeStyle="#1f6feb"; c.lineWidth=1.3; c.strokeRect(a*S,b*S,(cc-a)*S,(d-b)*S); c.setLineDash([]); c.fillStyle="#1f6feb"; c.beginPath(); c.arc(cc*S,d*S,8,0,Math.PI*2); c.fill(); c.restore(); }
function setSel(p, ids){
  if (sel && (!p || sel.p!==p)) clearLive(sel.p);
  if (!p || !ids || !ids.size){ sel=null; $("selBar").hidden=true; $("selHint").hidden=true; return; }
  sel={p, ids}; sel.bb=selBBox(p); drawSel(p); $("selBar").hidden=false; $("selHint").hidden=false;
}
function inPoly(x,y,P){ let c=false; for (let i=0,j=P.length-1;i<P.length;j=i++){ const [xi,yi]=P[i],[xj,yj]=P[j]; if (((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function lassoDown(p, [x,y]){
  if (sel && sel.p===p){ const [a,b,c,d]=sel.bb, r=14/S;
    if (Math.hypot(x-c,y-d)<r*1.5){ selDrag={mode:"scale", x, y, ax:a+6, ay:b+6, orig:strokesOf(p,sel.ids).map(cloneStroke)}; startDragCache(p); return; }
    if (x>=a && x<=c && y>=b && y<=d){ selDrag={mode:"move", x, y, orig:strokesOf(p,sel.ids).map(cloneStroke)}; startDragCache(p); return; } }
  setSel(null); lassoPath={p, pts:[[x,y]]};
}
function lassoMove(p, [x,y]){
  if (lassoPath && lassoPath.p===p){ lassoPath.pts.push([x,y]); const c=p.el.live.getContext("2d"); clearLive(p); c.save(); c.setLineDash([4,4]); c.strokeStyle="#1f6feb"; c.lineWidth=1.3; c.fillStyle="rgba(31,111,235,.06)";
    c.beginPath(); lassoPath.pts.forEach((q,i)=>i?c.lineTo(q[0]*S,q[1]*S):c.moveTo(q[0]*S,q[1]*S)); c.closePath(); c.fill(); c.stroke(); c.restore(); return; }
  if (!selDrag || !sel || sel.p!==p) return;
  const d=selDrag;
  if (d.mode==="move"){ d.dx=x-d.x; d.dy=y-d.y; }
  else { const d0=Math.hypot(d.x-d.ax,d.y-d.ay)||1; d.f=Math.max(0.15, Math.hypot(x-d.ax,y-d.ay)/d0); }
  if (!rafPending){ rafPending=true; requestAnimationFrame(()=>{ rafPending=false; paintDragCache(p); }); }
}
// 끄는 동안: 선택한 글씨를 그림 한 장으로 만들어 그것만 옮겨 그림 (글이 많아도 매끄럽게)
function startDragCache(p){
  const live=p.el.live, cv=document.createElement("canvas"); cv.width=live.width; cv.height=live.height;
  const c=cv.getContext("2d"), dpr=live.width/(PW*S); c.setTransform(dpr,0,0,dpr,0,0);
  for (const st of strokesOf(p,sel.ids)) if (st.hl) drawStroke(c, st, S); for (const st of strokesOf(p,sel.ids)) if (!st.hl) drawStroke(c, st, S);
  selDrag.cache=cv; selDrag.dx=0; selDrag.dy=0; selDrag.f=1; drawInk(p, sel.ids); paintDragCache(p);
}
function paintDragCache(p){
  const d=selDrag; if (!d||!d.cache) return; const c=p.el.live.getContext("2d"); clearLive(p); c.save();
  if (d.mode==="move") c.translate(d.dx*S, d.dy*S); else { c.translate(d.ax*S, d.ay*S); c.scale(d.f, d.f); c.translate(-d.ax*S, -d.ay*S); }
  c.drawImage(d.cache, 0, 0, PW*S, PH*S);
  const [a,b,cc,dd]=sel.bb; c.setLineDash([5/(d.f||1),4/(d.f||1)]); c.strokeStyle="#1f6feb"; c.lineWidth=1.3/(d.f||1); c.strokeRect(a*S,b*S,(cc-a)*S,(dd-b)*S); c.restore();
}
function applyDrag(p){
  const d=selDrag, byId=new Map(p.strokes.map(s=>[s.id,s])), f=d.f||1, dx=d.dx||0, dy=d.dy||0;
  for (const o of d.orig){ const s=byId.get(o.id); if (!s) continue;
    s.pts=o.pts.map(q=>{ const r=q.slice(); if (d.mode==="move"){ r[0]=q[0]+dx; r[1]=q[1]+dy; } else { r[0]=d.ax+(q[0]-d.ax)*f; r[1]=d.ay+(q[1]-d.ay)*f; } return r; });
    if (d.mode==="scale") s.w=o.w*Math.max(0.4,Math.min(2.5,f)); delete s._bb; }
}
function lassoUp(p){
  if (lassoPath && lassoPath.p===p){ const P=lassoPath.pts; lassoPath=null; clearLive(p); if (P.length<3){ setSel(null); return; }
    const ids=new Set(p.strokes.filter(s=>{ let n=0; for (const q of s.pts) if (inPoly(q[0],q[1],P)) n++; return n/s.pts.length>=0.5; }).map(s=>s.id));
    setSel(p, ids); if (!ids.size) toast("선택된 글씨가 없어요. 글씨를 둘러서 그려 보세요."); return; }
  if (selDrag && sel && sel.p===p){ applyDrag(p); const d=selDrag; selDrag=null; const now=strokesOf(p,sel.ids).map(cloneStroke);
    pushUndo({pid:p.id, removed:d.orig, added:now}); markDirty(p); sel.bb=selBBox(p); drawInk(p); }
}
function deleteSel(){ if (!sel) return; const p=sel.p, rm=strokesOf(p,sel.ids).map(cloneStroke); p.strokes=p.strokes.filter(s=>!sel.ids.has(s.id)); pushUndo({pid:p.id, removed:rm, added:[]}); setSel(null); drawInk(p); markDirty(p); }
function copySel(){ if (!sel) return; CLIP=strokesOf(sel.p,sel.ids).map(cloneStroke); toast(`${CLIP.length}획을 복사했어요.`); }
function pageInView(){ const top=$("scroller").getBoundingClientRect().top; let best=pages[0], bd=1e9; for (const p of pages){ const r=p.el.root.getBoundingClientRect(); const d=Math.abs(r.top-top-40); if (r.bottom>top && d<bd){ bd=d; best=p; } } return best; }
function pasteClip(){ if (!CLIP||!CLIP.length){ toast("복사한 글씨가 없어요."); return; } const p=sel?sel.p:pageInView(); const t=Date.now();
  const add=CLIP.map((s,i)=>({...cloneStroke(s), id:uid(), t0:t+i, pts:s.pts.map(q=>{ const r=q.slice(); r[0]+=20; r[1]+=20; return r; })}));
  p.strokes.push(...add); pushUndo({pid:p.id, removed:[], added:add}); drawInk(p); markDirty(p); setTool("lasso"); setSel(p, new Set(add.map(s=>s.id))); }
function recolorSel(c){ const p=sel.p, rm=strokesOf(p,sel.ids).map(cloneStroke); for (const s of strokesOf(p,sel.ids)) if (!s.hl) s.color=c; pushUndo({pid:p.id, removed:rm, added:strokesOf(p,sel.ids).map(cloneStroke)}); drawInk(p); markDirty(p); }
$("sDel").onclick=deleteSel;
function widthSel(f){ if (!sel) return; const p=sel.p, rm=strokesOf(p,sel.ids).map(cloneStroke); for (const s of strokesOf(p,sel.ids)) if (!s.hl) s.w=Math.max(0.4, Math.min(20, s.w*f)); pushUndo({pid:p.id, removed:rm, added:strokesOf(p,sel.ids).map(cloneStroke)}); sel.bb=selBBox(p); drawInk(p); markDirty(p); }
$("sThin").onclick=()=>widthSel(0.8); $("sThick").onclick=()=>widthSel(1.25); $("sCopy").onclick=copySel; $("sPaste").onclick=pasteClip; $("sDup").onclick=()=>{ copySel(); pasteClip(); }; $("sNone").onclick=()=>setSel(null);
document.addEventListener("keydown", e=>{ if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if ((e.key==="Delete"||e.key==="Backspace") && sel){ e.preventDefault(); deleteSel(); }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="c" && sel){ e.preventDefault(); copySel(); }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="v"){ e.preventDefault(); pasteClip(); } });

// ---------- 노트북 ----------
async function prunePages(){ try{ const keep=new Set(pages.map(p=>p.id)); for (const q of (await store.all("pages")||[])) if (q.nb===curBook.id && !keep.has(q.id)) await store.del("pages", q.id); }catch(e){} }
function bookLabel(){ $("tBooks").textContent="📒 "+(curBook?curBook.name:"노트"); }
async function openBook(id){
  await flush(); setSel && setSel(null);
  curBook=BOOKS.find(b=>b.id===id)||BOOKS[0];
  const all=await store.all("pages")||[]; const byId=new Map(all.map(p=>[p.id,p]));
  pages=(curBook.order||[]).map(i=>byId.get(i)).filter(Boolean); await loadBgs(pages);
  if (!pages.length){ pages=[newPage("ruled")]; markDirty(pages[0]); }
  undoStack.length=redoStack.length=0; syncUndo(); renderAll(); bookLabel(); markDirty(null);
  $("scroller").scrollTop=0;
}
function renderBooks(){
  const box=$("bookList"); box.innerHTML="";
  BOOKS.slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(b=>{
    const row=document.createElement("div"); row.style.cssText="display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px";
    const name=document.createElement("input"); name.value=b.name; name.style.cssText="flex:1;border:none;background:none;font-size:15px;color:var(--ink);-webkit-user-select:text;user-select:text"+(b===curBook?";font-weight:600":"");
    name.onchange=()=>{ b.name=name.value.trim()||b.name; bookLabel(); markDirty(null); };
    const info=document.createElement("small"); info.style.color="var(--muted)"; info.textContent=`${(b.order||[]).length}쪽`;
    const open=document.createElement("button"); open.className="btn"; open.textContent=b===curBook?"열려 있음":"열기"; open.disabled=b===curBook;
    open.onclick=async()=>{ $("dlgBooks").close(); await openBook(b.id); toast(`'${b.name}' 노트북을 열었어요.`); };
    const del=document.createElement("button"); del.className="btn danger"; del.textContent="삭제";
    del.onclick=()=>{ $("dlgBooks").close(); confirmBox(`'${b.name}' 노트북을 삭제할까요?`, "안의 페이지와 필기가 모두 지워지고 되돌릴 수 없어요. 필요하면 먼저 필체 데이터를 다운로드하세요.", "삭제", async()=>{
      try{ for (const q of (await store.all("pages")||[])) if (q.nb===b.id || (b.order||[]).includes(q.id)){ await store.del("pages", q.id); try{ await store.del("meta","bg:"+q.id); }catch(e){} } }catch(e){}
      BOOKS=BOOKS.filter(x=>x!==b); if (!BOOKS.length) BOOKS=[{id:uid(), name:"내 노트", order:[], updated:Date.now()}];
      if (b===curBook){ curBook=null; await openBook(BOOKS[0].id); } else markDirty(null); toast("노트북을 삭제했어요."); }); };
    row.append(name,info,open,del); box.appendChild(row);
  });
}
$("tBooks").onclick=()=>{ renderBooks(); $("newBookName").value=""; $("dlgBooks").showModal(); };
$("newBookGo").onclick=async()=>{ const n=$("newBookName").value.trim()||`노트 ${BOOKS.length+1}`; const b={id:uid(), name:n, order:[], updated:Date.now()}; BOOKS.push(b); $("dlgBooks").close(); await openBook(b.id); toast(`'${n}' 노트북을 만들었어요.`); };

// ---------- 필체 데이터 다운로드 (손글씨만, 전체 노트) ----------
function handInfo(){ $("handInfo").textContent = set.lastDataExport ? `마지막 다운로드: ${new Date(set.lastDataExport).toLocaleString("ko-KR")} · 라벨링 도구의 '노트 파일 열기'에 넣으면 학습 데이터가 돼요.` : "아직 다운로드한 적이 없어요. 쓴 만큼 필체 데이터가 쌓여 있어요."; }
async function exportHandData(){
  await flush(); const all=await store.all("pages")||[]; const byId=new Map(all.map(p=>[p.id,p])); const out=[]; let n=0;
  for (const b of BOOKS) for (const id of (b.order||[])){ const pg=b===curBook?pages.find(x=>x.id===id):byId.get(id); if (!pg) continue;
    const strokes=pg.strokes.filter(s=>(!s.src||s.src==="hand") && !s.hl).map(({_bb,...s})=>s); if (!strokes.length) continue; n+=strokes.length;
    out.push({ id:pg.id, book:b.name, paper: pg.bg?{type:"blank",gap:40}:pg.paper, strokes, ...(pg.guideLines?{guideLines:pg.guideLines}:{}) }); }
  if (!n){ toast("아직 손으로 쓴 필기가 없어요."); return; }
  const data=JSON.stringify({ format:"hw-notebook-v1", kind:"hand-only", exportedAt:new Date().toISOString(), units:{pageW:PW,pageH:PH,mmPerUnit:0.21}, point:["x","y","t","p","tx","ty"],
    paperSpec:{ruledTop:140, margin:80, gridOrigin:[20,60]}, settings:{device:set.device, gamma:set.gamma}, device:{ua:navigator.userAgent}, pages:out });
  try{ await saveFile(`필체데이터_${stamp()}.json`, data); set.lastDataExport=Date.now(); markDirty(null); handInfo(); toast(`손글씨 ${out.length}쪽 · ${n}획을 저장했어요.`); }
  catch(e){ if (!(e&&e.code==="declined")) toast("파일을 저장하지 못했어요."); }
}
$("btnHandData").onclick=exportHandData;

let paperTarget=null;
$("tAddPage").onclick=()=>{ paperTarget=null; $("paperTitle").textContent="새 페이지"; $("dlgPaper").showModal(); };
function movePage(p,dir){ const i=pages.indexOf(p), j=i+dir; if (j<0||j>=pages.length) return; pages.splice(i,1); pages.splice(j,0,p); renderAll(); markDirty(null); requestAnimationFrame(()=>p.el.root.scrollIntoView({block:"start"})); }

      window.pdfjsLib.GlobalWorkerOptions.workerSrc= src.startsWith("https://cdnjs") || !src ? "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" : src.replace(/pdf\.min\.js$/,"pdf.worker.min.js"); }).catch(e=>{ pdfReady=null; throw e; });
  return pdfReady;
}
function canvasToBg(cv){ return { src:cv.toDataURL("image/jpeg",0.85), w:cv.width, h:cv.height }; }
async function importForm(file){
  const st=$("formStatus"), added=[];
  try{
    if (file.type==="application/pdf" || /\.pdf$/i.test(file.name)){
      st.textContent="PDF 읽는 중…"; await loadPdfJs();
      const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
      for (let n=1;n<=pdf.numPages;n++){
        st.textContent=`PDF ${n}/${pdf.numPages}쪽 불러오는 중…`;
        const pg=await pdf.getPage(n), v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:1600/v0.width});
        const cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
        const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height);
        await pg.render({canvasContext:cx, viewport:vp}).promise;
        added.push({ id:uid(), paper:{type:"blank",gap:40}, strokes:[], bg:canvasToBg(cv) });
      }
    } else {
      st.textContent="사진 읽는 중…";
      const url=URL.createObjectURL(file); const img=new Image(); await new Promise((r,j)=>{ img.onload=r; img.onerror=j; img.src=url; });
      const sc=Math.min(1, 1800/Math.max(img.naturalWidth,img.naturalHeight)); const cv=document.createElement("canvas");
      cv.width=Math.round(img.naturalWidth*sc); cv.height=Math.round(img.naturalHeight*sc); const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url); added.push({ id:uid(), paper:{type:"blank",gap:40}, strokes:[], bg:canvasToBg(cv) });
    }
  }catch(e){ st.textContent="불러오지 못했어요. PDF는 처음 한 번 인터넷 연결이 필요해요."; return; }
  pages.push(...added); renderAll(); added.forEach(markDirty); st.textContent="";
  $("dlgPaper").close(); toast(`양식 ${added.length}쪽을 불러왔어요.`);
  requestAnimationFrame(()=>added[0].el.root.scrollIntoView({behavior:"smooth", block:"start"}));
}
$("btnImportForm").onclick=()=>$("fileForm").click();
$("tForm").onclick=()=>$("fileForm").click();
$("fileForm").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if (f) importForm(f); };

async function deletePage(p){
  pages=pages.filter(x=>x!==p); for (const st of [undoStack,redoStack]) for (let i=st.length-1;i>=0;i--) if (st[i].pid===p.id) st.splice(i,1);
  try{ await store.del("pages", p.id); await store.del("meta","bg:"+p.id); }catch(e){}
  if (!pages.length) pages.push(newPage("ruled"));
  renderAll(); syncUndo(); markDirty(null);
}
function confirmBox(title, text, okLabel, fn){ $("cfTitle").textContent=title; $("cfText").textContent=text; $("cfOk").textContent=okLabel; $("cfOk").onclick=()=>{ $("dlgConfirm").close(); fn(); }; $("dlgConfirm").showModal(); }

function syncTools(){ [...$("colors").children].forEach((b,i)=>b.setAttribute("aria-pressed", i===(tool==="hl"?(set.hlColor||0):set.color))); [...$("widths").children].forEach((b,i)=>b.setAttribute("aria-pressed", i===set.width)); }

  $("dlgSettings").showModal(); };

$("btnWipe").onclick=()=>{ $("dlgSettings").close(); confirmBox("모든 페이지를 삭제할까요?","노트 전체가 지워지고 되돌릴 수 없어요. 필요하면 먼저 내보내 두세요.","모두 삭제", async()=>{
  pages=[newPage("ruled")]; undoStack.length=redoStack.length=0; syncUndo(); await prunePages(); renderAll(); markDirty(pages[0]); toast("노트를 비웠어요."); }); };

// ---------- 내보내기 / 가져오기 ----------
function exportJson(){
  return JSON.stringify({ format:"hw-notebook-v1", exportedAt:new Date().toISOString(),
    units:{pageW:PW, pageH:PH, mmPerUnit:0.21}, point:["x","y","t","p","tx","ty"],
    paperSpec:{ruledTop:140, margin:80, gridOrigin:[20,60]},
    settings:{device:set.device, gamma:set.gamma}, device:{ua:navigator.userAgent},
    pages:pages.map(p=>({id:p.id, paper:p.paper, strokes:p.strokes.map(({_bb,...s})=>s), ...(p.guideLines?{guideLines:p.guideLines}:{}), ...(p.bg?{bg:p.bg}:{})})) });
}
let downloads=null;
const stamp=()=>{ const d=new Date(), z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`; };
function androidSave(name, data){
  const blob = data instanceof Blob ? data : new Blob([data], {type: /\.pdf$/i.test(name)?"application/pdf":"application/json"});
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ window.__androidSaved=ok=>{ window.__androidSaved=null; ok?res():rej({code:"declined"}); };
    window.Android.saveFile(name, blob.type||"application/octet-stream", String(fr.result).split(",")[1]); }; fr.onerror=()=>rej({code:"read"}); fr.readAsDataURL(blob); });
}
async function saveFile(name, data){
  if (window.Android && window.Android.saveFile) return androidSave(name, data);
  if (downloads){
    for (let i=0;;i++){ try{ await downloads.save({filename:name, data}); return; }
      catch(e){ if (e && e.code==="rate_limited" && i<4){ await new Promise(r=>setTimeout(r, 1200)); continue; } throw e; } } }
  if (window.claude && window.claude.use) throw {code:"unavailable"};
  const blob = data instanceof Blob ? data : new Blob([data], {type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
// ---- PDF (벡터) ----
function loadScriptFrom(urls){ return new Promise((res,rej)=>{ let i=0; const next=()=>{ if (i>=urls.length) return rej(); const sc=document.createElement("script"); sc.src=urls[i++]; sc.onload=res; sc.onerror=()=>{ sc.remove(); next(); }; document.head.appendChild(sc); }; next(); }); }
let jsPDFReady=null;
function loadJsPDF(){
  if (window.jspdf) return Promise.resolve();
  if (!jsPDFReady) jsPDFReady=loadScriptFrom(["lib/jspdf.umd.min.js","jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"]).catch(e=>{ jsPDFReady=null; throw e; });
  return jsPDFReady;
}
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function buildPdf(){
  const doc=new window.jspdf.jsPDF({unit:"mm", format:"a4", compress:true}); const k=0.21;
  pages.forEach((p,i)=>{
    if (i) doc.addPage();
    const {type,gap}=p.paper; doc.setLineWidth(0.15);
    if (p.bg){ const [x,y,w,h]=bgRect(p); try{ doc.addImage(p.bg.src, "JPEG", x*k, y*k, w*k, h*k); }catch(e){} }
    else if (type!=="blank"){ const cv=document.createElement("canvas"), sc=1.6; cv.width=PW*sc; cv.height=PH*sc; const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); paintPaper(cx,type,gap,sc);
      try{ doc.addImage(cv.toDataURL("image/jpeg",0.9), "JPEG", 0, 0, PW*k, PH*k); }catch(e){} }
    doc.setLineCap("round"); doc.setLineJoin("round");
    for (const st of p.strokes.filter(s=>s.hl)){ const P=st.pts; if (P.length<2) continue; const [r,g,b]=hexRgb(st.color);
      try{ doc.setGState(new doc.GState({opacity:0.42})); }catch(e){} doc.setDrawColor(r,g,b); doc.setLineWidth(st.w*k);
      const d=[]; for (let j=1;j<P.length;j++) d.push([(P[j][0]-P[j-1][0])*k,(P[j][1]-P[j-1][1])*k]); doc.lines(d, P[0][0]*k, P[0][1]*k, [1,1], "S", false);
      try{ doc.setGState(new doc.GState({opacity:1})); }catch(e){} }
    for (const st of p.strokes.filter(s=>!s.hl)){
      const P=st.pts; if (!P.length) continue; const [r,g,b]=hexRgb(st.color); doc.setDrawColor(r,g,b); doc.setFillColor(r,g,b);
      if (P.length===1){ doc.circle(P[0][0]*k, P[0][1]*k, Math.max(0.1, st.w*pressureFactor(P[0][3])*k/2), "F"); continue; }
      let run=null, rw=0;
      const flush=()=>{ if (run && run.length>1){ doc.setLineWidth(rw); const d=[]; for (let j=1;j<run.length;j++) d.push([(run[j][0]-run[j-1][0])*k,(run[j][1]-run[j-1][1])*k]); doc.lines(d, run[0][0]*k, run[0][1]*k, [1,1], "S", false); } };
      for (let j=1;j<P.length;j++){
        const a=P[j-1], c=P[j], v=Math.hypot(c[0]-a[0],c[1]-a[1])/Math.max(1,c[2]-a[2]);
        const w=Math.max(0.12, Math.round(st.w*pressureFactor((a[3]+c[3])/2)*Math.max(0.6,1.1-0.25*v)*k*20)/20);
        if (!run || w!==rw){ flush(); run=[a]; rw=w; }
        run.push(c);
      }
      flush();
    }
  });
  return doc.output("blob");
}
async function exportPdf(quiet){ if(!quiet) toast("PDF 만드는 중…");
  try{ await loadJsPDF(); }catch(e){ toast("PDF 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); return false; }
  try{ await saveFile(`필체노트_${stamp()}.pdf`, buildPdf()); if(!quiet) toast("PDF를 저장했어요."); return true; }
  catch(e){ if (e&&e.code==="declined") return false; if(!quiet) toast("PDF를 저장하지 못했어요."); return false; } }
async function exportJsonFile(quiet){
  try{ await saveFile(`필체노트_${stamp()}.json`, exportJson()); exported(); if(!quiet) toast("JSON을 저장했어요."); return true; }
  catch(e){ if (e&&e.code==="declined") return false; if(!quiet) toast("JSON을 저장하지 못했어요. 설정 → 하나씩 골라 저장 → JSON 복사를 써 주세요."); return false; } }
function openExport(){ const n=pages.reduce((a,p)=>a+p.strokes.length,0);
  $("exInfo").textContent=`페이지 ${pages.length}장, 획 ${n}개`; $("exportBox").style.display="none"; $("dlgExport").showModal(); }
let saving=false;
function downloadNow(name, blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
async function saveBoth(){
  if (saving) return;
  // 일반 브라우저(GitHub 사이트 등): 두 파일을 '누른 그 순간'에 한꺼번에 내려받아야 브라우저가 두 번째 파일을 막지 않아요
  if (!window.Android && !downloads){
    if (!window.jspdf){ toast("PDF 도구를 준비하는 중이에요. 잠시 후 다시 눌러 주세요."); loadJsPDF().catch(()=>toast("PDF 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.")); return; }
    let pdf=null; try{ pdf=buildPdf(); }catch(e){}
    const name=`필체노트_${stamp()}`;
    if (pdf) downloadNow(name+".pdf", pdf);
    downloadNow(name+".json", new Blob([exportJson()],{type:"application/json"})); exported();
    toast(pdf? "PDF와 JSON을 저장했어요. 둘 중 하나가 없으면 아래 버튼으로 다시 받으세요." : "JSON은 저장했고 PDF는 만들지 못했어요.",
      [{label:"PDF 다시", fn:()=>{ try{ downloadNow(name+".pdf", buildPdf()); }catch(e){ toast("PDF를 만들지 못했어요."); } }}, {label:"JSON 다시", fn:()=>downloadNow(name+".json", new Blob([exportJson()],{type:"application/json"}))}], 12000);
    return;
  }
  saving=true; $("tExport").disabled=true;
  try{
    const j=await exportJsonFile(true);
    await new Promise(r=>setTimeout(r, 400));
    const pdf=await exportPdf(true);
    const retry=[];
    if (!j) retry.push({label:"JSON 다시 받기", fn:()=>exportJsonFile()});
    if (!pdf) retry.push({label:"PDF 다시 받기", fn:()=>exportPdf()});
    if (j && pdf) toast("PDF와 JSON을 저장했어요. 다운로드 목록에 없으면 다시 받으세요.", [{label:"JSON 다시", fn:()=>exportJsonFile()},{label:"PDF 다시", fn:()=>exportPdf()}], 9000);
    else toast(j? "JSON은 저장했고 PDF는 받지 못했어요." : pdf? "PDF는 저장했고 JSON은 받지 못했어요." : "파일을 받지 못했어요.", retry, 15000);
  }
  finally{ saving=false; $("tExport").disabled=false; }
}
$("tExport").onclick=saveBoth;
$("btnExport").onclick=()=>{ $("dlgSettings").close(); openExport(); };
function exported(){ set.lastExport=Date.now(); markDirty(null); }
$("exPdf").onclick=async()=>{ if (!window.Android && !downloads && window.jspdf){ try{ downloadNow(`필체노트_${stamp()}.pdf`, buildPdf()); $("dlgExport").close(); toast("PDF를 저장했어요."); }catch(e){ toast("PDF를 만들지 못했어요."); } return; } if (await exportPdf()) $("dlgExport").close(); };
$("exJson").onclick=async()=>{ if (await exportJsonFile()) $("dlgExport").close(); };
$("exBoth").onclick=async()=>{ $("dlgExport").close(); await saveBoth(); };
$("btnCopy").onclick=async()=>{ const t=exportJson(); try{ await navigator.clipboard.writeText(t); exported(); toast("JSON을 복사했어요."); }
  catch(e){ const b=$("exportBox"); b.value=t; b.style.display="block"; b.focus(); b.select(); toast("아래 내용을 전체 선택해서 복사해 주세요."); } };
$("btnImport").onclick=()=>$("fileImport").click();
$("fileImport").onchange=async e=>{ const f=e.target.files[0]; e.target.value=""; if (!f) return;
  if (f.type==="application/pdf" || /\.pdf$/i.test(f.name) || (f.type||"").startsWith("image/")){ $("dlgSettings").close(); toast("양식 불러오는 중…"); importForm(f); return; }
  try{ const j=JSON.parse(await f.text()); if (j.format!=="hw-notebook-v1" || !Array.isArray(j.pages)) throw 0;
    $("dlgSettings").close();
    confirmBox("노트를 가져올까요?", `페이지 ${j.pages.length}장으로 지금 노트를 바꿔요. 지금 노트는 사라져요.`, "가져오기", async()=>{
      pages=j.pages.map(p=>({id:p.id||uid(), paper:p.paper&&PAPER[p.paper.type]?p.paper:{type:"ruled",gap:40}, strokes:Array.isArray(p.strokes)?p.strokes:[], ...(Array.isArray(p.guideLines)?{guideLines:p.guideLines}:{}), ...(p.bg&&p.bg.src?{bg:p.bg}:{})}));
      if (!pages.length) pages=[newPage("ruled")]; undoStack.length=redoStack.length=0; syncUndo();
      await prunePages(); renderAll(); pages.forEach(markDirty); toast("노트를 가져왔어요."); });
  }catch(err){ toast("hw-notebook-v1 형식의 JSON 파일이 아니에요."); } };

// ---------- 시작 ----------
async function init(){
  try{ await store.open(); }catch(e){ toast("이 브라우저에서는 저장이 안 돼요. 노트 내보내기로 백업해 주세요."); }
  try{
    const all=await store.all("pages")||[]; const byId=new Map(all.map(p=>[p.id,p]));
    const lib=await store.get("meta","library");
    if (lib && lib.books && lib.books.length){ BOOKS=lib.books; curBook=BOOKS.find(b=>b.id===lib.current)||BOOKS[0]; const st=await store.get("meta","settings"); if (st) Object.assign(set, st); }
    else { const meta=await store.get("meta","notebook"); if (meta) Object.assign(set, meta.set||{}); curBook={id:uid(), name:"내 노트", order:meta?(meta.order||[]):[], updated:Date.now()}; BOOKS=[curBook]; }
    pages=(curBook.order||[]).map(id=>byId.get(id)).filter(Boolean); await loadBgs(pages);
  }catch(e){ if (!curBook){ curBook={id:uid(), name:"내 노트", order:[], updated:Date.now()}; BOOKS=[curBook]; } }
  if (!pages.length){ pages=[newPage("ruled")]; markDirty(pages[0]); }
  pages.forEach(markDirty); bookLabel(); handInfo();
  try{ const pk=await store.get("meta","pack"); if (pk && pk.format==="hw-pack-v1") PACK=pk; }catch(e){}
  $("packUrl").value=set.packUrl||""; updatePack(false);
  packInfo();
  if (set.lastDataExport && Date.now()-set.lastDataExport>7*864e5) setTimeout(()=>toast("필체 데이터를 다운로드한 지 일주일이 넘었어요.", [{label:"지금 다운로드", fn:exportHandData}], 12000), 1500);
  applyDevice(); renderSwatches(); syncTools(); setTool("pen"); renderAll(); syncUndo();
  $("tEraseSize").textContent=set.eraserBig?"크게":"작게";
  $("saveState").textContent = store.db ? "저장됨" : "저장 안 됨";
  new ResizeObserver(()=>layout()).observe($("scroller"));
  setTimeout(()=>loadJsPDF().catch(()=>{}), 1200);
  try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}     // 기기가 저장 공간이 부족해도 노트를 지우지 않도록 요청

  if (window.claude && window.claude.use) window.claude.use("downloads").then(d=>{ downloads=d; }).catch(()=>{});
}
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="hidden") flush(); });
init();
})();
